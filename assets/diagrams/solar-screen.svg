<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><title>Screen openness illustration, not specific fabric samples</title><rect width="720" height="400" rx="16" fill="#f5f5f5"/><defs><pattern id="tight" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#9ba5a2"/><rect x="6" y="6" width="6" height="6" fill="#e9eeee"/></pattern><pattern id="open" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#9ba5a2"/><rect x="3" y="3" width="12" height="12" fill="#e9eeee"/></pattern></defs><text x="34" y="46" fill="#202020" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Tighter weave</text><rect x="34" y="75" width="300" height="250" rx="6" fill="url(#tight)"/><text x="34" y="366" fill="#666" font-family="Arial,sans-serif" font-size="18">Less light and view through</text><text x="380" y="46" fill="#202020" font-family="Arial,sans-serif" font-size="22" font-weight="bold">More open weave</text><rect x="380" y="75" width="300" height="250" rx="6" fill="url(#open)"/><text x="380" y="366" fill="#666" font-family="Arial,sans-serif" font-size="18">More light and view through</text></svg>
